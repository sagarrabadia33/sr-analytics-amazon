<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect your account — SR Analytics</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#0b0d12; --panel:#151924; --text:#eef1f7; --muted:#9aa4b8; --accent:#5b8cff; --good:#34d399; --border:#232a3a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:560px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:36px; }
    .logo { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
    .logo .mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#5b8cff,#8b6cff); }
    .logo b { font-weight:800; font-size:17px; }
    h1 { font-size:22px; margin-bottom:10px; }
    p { color:var(--muted); font-size:15px; margin-bottom:16px; }
    .ok { color:var(--good); font-weight:600; }
    .codebox { background:#0e1118; border:1px solid var(--border); border-radius:12px; padding:16px; margin:18px 0; }
    .codebox label { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px; }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; word-break:break-all; color:var(--text); }
    .btn { display:inline-block; background:var(--accent); color:#fff; border:none; padding:12px 22px; border-radius:10px; font-weight:600; font-size:15px; cursor:pointer; text-decoration:none; }
    .btn:hover { opacity:.9; }
    .btn.secondary { background:transparent; border:1px solid var(--border); color:var(--text); margin-left:10px; }
    .row { margin-top:14px; }
    .muted-small { font-size:13px; color:var(--muted); margin-top:20px; }
    .err { color:#ff7a7a; }
    #copied { color:var(--good); font-size:13px; margin-left:10px; display:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="mark"></span><b>SR&nbsp;Analytics</b></div>
    <div id="content"><p>Reading your authorization…</p></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("spapi_oauth_code");
      var sellingPartnerId = params.get("selling_partner_id") || "";
      var state = params.get("state") || "";
      var el = document.getElementById("content");

      if (!code) {
        el.innerHTML =
          '<h1 class="err">No authorization code found</h1>' +
          '<p>This page is opened automatically after you authorize SR Analytics in Amazon Seller Central. ' +
          'If you reached it by mistake, you can close this tab. If you just clicked “Authorize” and see this, ' +
          'please contact <a href="mailto:sagar@sranalytics.io" style="color:var(--accent)">sagar@sranalytics.io</a>.</p>';
        return;
      }

      var mailBody =
        "Authorization code: " + code +
        (sellingPartnerId ? ("\nSelling Partner ID: " + sellingPartnerId) : "") +
        (state ? ("\nReference: " + state) : "");
      var mailto = "mailto:sagar@sranalytics.io" +
        "?subject=" + encodeURIComponent("Amazon authorization code" + (state ? (" - " + state) : "")) +
        "&body=" + encodeURIComponent(mailBody);

      el.innerHTML =
        '<h1><span class="ok">✓</span> You’re authorized</h1>' +
        '<p>Thank you — you’ve securely authorized SR Analytics to read your Amazon reporting data. ' +
        'One last step: <b>copy the code below and send it to us</b> so we can finish connecting your account.</p>' +
        '<div class="codebox"><label>Authorization code</label><div class="code" id="code">' + code + '</div></div>' +
        (sellingPartnerId ? '<div class="codebox"><label>Selling Partner ID</label><div class="code">' + sellingPartnerId + '</div></div>' : '') +
        '<div class="row">' +
          '<button class="btn" id="copyBtn">Copy code</button>' +
          '<a class="btn secondary" href="' + mailto + '">Email it to us</a>' +
          '<span id="copied">Copied!</span>' +
        '</div>' +
        '<p class="muted-small">This code expires in a few minutes and is useless on its own. ' +
        'You did not grant SR Analytics any login access to your account, and you can revoke this connection ' +
        'anytime in Seller Central. We only read business reporting data — never buyer personal information.</p>';

      document.getElementById("copyBtn").addEventListener("click", function () {
        navigator.clipboard.writeText(code).then(function () {
          var c = document.getElementById("copied");
          c.style.display = "inline";
          setTimeout(function () { c.style.display = "none"; }, 2000);
        });
      });
    })();
  </script>
</body>
</html>
